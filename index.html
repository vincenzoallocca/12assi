:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
::selection{background:var(--accent);color:#000}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.mono,.kick,.meta,.box h3,.tab,.gallery-filter,.stat,.btn,.sec{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.12em}
.wrap{max-width:600px;margin:0 auto;padding:18px 18px 56px}
.top0{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}
.logo{font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;cursor:pointer}.logo span{color:var(--accent)}
.stat{font-size:11px;color:var(--mute)}
.sec{font-size:11px;color:var(--mute);margin:34px 0 0}
h1{font-size:clamp(44px,13vw,76px);line-height:.92;margin:12px 0 22px;font-weight:800;text-transform:uppercase;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--accent)}
p{color:var(--mute);line-height:1.55;margin:0 0 14px}
.btn{font-size:13px;font-weight:700;background:var(--ink);color:#000;border:1px solid var(--ink);border-radius:0;padding:15px 22px;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.bar{height:2px;background:var(--line);margin:22px 0 10px}.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;gap:10px}
.q{font-size:clamp(26px,7vw,34px);line-height:1.1;font-weight:700;margin:40px 0 30px;min-height:110px;letter-spacing:-.02em}
.opts{display:grid;gap:0;border-top:1px solid var(--line)}
.opt{font:inherit;text-align:left;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:17px 4px;font-size:17px;cursor:pointer;display:flex;justify-content:space-between;transition:padding .15s,color .15s}
.opt::after{content:"→";color:var(--mute)}
.opt:hover{padding-left:14px;color:var(--accent)}.opt:hover::after{color:var(--accent)}
.axtag{color:var(--mute)}
.card{margin-top:22px}
.kick{color:var(--accent);font-size:12px}
.card h2{font-size:clamp(40px,12vw,68px);line-height:.92;margin:10px 0 24px;letter-spacing:-.035em;text-transform:uppercase;font-weight:800}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px}
.hero{background:var(--bg);padding:16px 12px 18px}
.hero .kick{margin-bottom:12px;font-size:10px;color:var(--mute)}
.ph{width:100%;max-width:140px;aspect-ratio:1;object-fit:cover;display:block;margin:0 0 12px;border-radius:0}
.ava{display:grid;place-items:center;font-weight:800;font-size:30px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.big{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.hero b{font-size:17px;line-height:1.1;display:block;margin-top:6px;text-transform:uppercase}
.box{border-top:1px solid var(--line);padding:18px 0 6px;margin-bottom:10px}
.box h3{margin:0 0 14px;font-size:11px;color:var(--mute);font-weight:500}
.ax{display:grid;grid-template-columns:26px 1fr 52px;gap:10px;align-items:center;margin-bottom:14px}
.ic{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}
.ax b{font-weight:600;font-size:15px;display:block;text-transform:uppercase;letter-spacing:.02em}.ax small{color:var(--mute);font-size:12px}
.trk{height:3px;background:var(--line);margin-top:7px}.trk i{display:block;height:100%;background:var(--accent)}
.pc{font-weight:800;font-size:19px;text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:16px;gap:10px;border-bottom:1px solid var(--line)}
.row span:last-child{font-weight:800;color:var(--accent)}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.tabs,.gallery-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab,.gallery-filter{font-size:10px;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:0;padding:7px 10px;cursor:pointer}
.tab.on,.gallery-filter.active{background:var(--ink);color:#000;border-color:var(--ink)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.gallery-card{background:var(--bg);padding:14px 12px}
.gallery-card:hover{background:var(--panel)}
.gallery-card .ph{width:72px;height:72px;margin:0 0 10px;font-size:20px}
.gallery-card b{font-size:13px;display:block;margin-bottom:4px;text-transform:uppercase}
.gallery-card small{color:var(--mute);font-size:11px}

.gallery-card{display:block;width:100%;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.gallery-card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.gallery-card .ph{object-fit:cover}
.hint{font-size:13px}
body.mopen{overflow:hidden}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mwrap{position:relative;width:100%;max-width:600px}
.mcard{background:var(--bg);border:1px solid var(--line);max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:22px 18px calc(30px + env(safe-area-inset-bottom,0px));outline:none}
.mclose{position:absolute;top:8px;right:8px;z-index:2;width:40px;height:40px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:24px;line-height:1;cursor:pointer}
.mclose:hover{border-color:var(--ink)}
@media(min-width:640px){.modal{align-items:center}.mcard{max-height:88vh}}
.mhead{display:flex;gap:16px;align-items:flex-end;padding-right:44px}
.mph{width:112px;height:112px;object-fit:cover;flex:none;display:block}
.mhead h2{font-size:clamp(26px,7vw,36px);line-height:.98;margin:6px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.mhead p{margin:0;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--mute);border:1px solid var(--line);padding:4px 7px}
.sim{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 14px;color:var(--ink);font-size:15px;line-height:1.4}
details.how{border-top:1px solid var(--line);margin-top:6px}
details.how summary{cursor:pointer;padding:14px 0;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--ink)}
.rax{margin:0 0 16px}
.rax>b{display:block;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:4px;font-weight:500}
.rq{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
.rq em{display:block;font-style:normal;margin-top:3px;color:var(--accent);font-weight:700;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em}
.notice{font-size:12px;border-left:2px solid var(--accent);padding:8px 12px;margin:12px 0;color:var(--mute)}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:var(--mute);font-size:10px}
.chart .grid{fill:none;stroke:var(--line);stroke-width:1}
.radar-shape{fill:rgba(255,59,31,.2);stroke:var(--accent);stroke-width:2}
.map-point{fill:#62b6a8;opacity:.52;cursor:pointer}
.map-point:hover,.map-point:focus{opacity:1;stroke:var(--ink);stroke-width:2}
.map-user{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.map-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.map-controls label,.gallery-controls label{display:grid;gap:5px;color:var(--mute);font-size:11px}
.map-controls select,.gallery-controls input,.gallery-controls select,.report-text{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:10px;min-width:0}
.map-nearest{display:grid;gap:0}
.map-nearest button{display:flex;justify-content:space-between;gap:8px;text-align:left;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer}
.map-nearest button span:last-child{color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}
.gallery-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.gallery-controls input[type="search"]{grid-column:1/-1;width:100%}
.report-text{display:block;width:100%;min-height:74px;resize:vertical;margin:8px 0}
.report-copy{margin:0 0 12px;padding:9px 12px;font-size:11px}
@media(max-width:420px){.map-controls,.gallery-controls{grid-template-columns:1fr}.gallery-controls input[type="search"]{grid-column:auto}}
</style>

function stripAccents(str){
  return String(str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
}

function buildImageCandidates(name){
  const raw = String(name || "").trim();
  if(!raw) return [];
  const noAcc = stripAccents(raw);
  const rawNoPunct = raw.replace(/[.,'"]/g, "");
  const noAccNoPunct = noAcc.replace(/[.,'"]/g, "");
  const tokens = raw.split(/\s+/).filter(Boolean);
  const tokensNoAcc = noAcc.split(/\s+/).filter(Boolean);

  const set = new Set();
  const add = v => { if (v && v.length > 1) set.add(v); };

  add(raw); add(noAcc); add(rawNoPunct); add(noAccNoPunct);

  for (const v of [raw, noAcc, rawNoPunct, noAccNoPunct]) {
    add(v.replace(/\s+/g, "_"));
    add(v.replace(/\s+/g, " "));
    add(v.toLowerCase());
    add(stripAccents(v).toLowerCase());
  }

  if (tokens.length > 1) {
    const first = tokens[0];
    const last = tokens[tokens.length - 1];
    const firstNo = tokensNoAcc[0];
    const lastNo = tokensNoAcc[tokensNoAcc.length - 1];
    add(first); add(last); add(firstNo); add(lastNo);
    add(`${first} ${last}`); add(`${firstNo} ${lastNo}`);
    add(`${first}_${last}`); add(`${firstNo}_${lastNo}`);
    add(`${last} ${first}`); add(`${lastNo} ${firstNo}`);
  }

  return [...set];
}

async function fetchCommonsImageByTitle(title){
  if(!title) return null;
  const cleaned = title.replace(/^File:/i, "").trim();
  const url = `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&titles=File:${encodeURIComponent(cleaned)}&prop=imageinfo&iiprop=url&iiurlwidth=600`;
  try{
    const res = await fetch(url, { headers: { Accept: "application/json" }});
    if(!res.ok) return null;
    const data = await res.json();
    const page = data?.query?.pages ? Object.values(data.query.pages)[0] : null;
    return page?.imageinfo?.[0]?.thumburl || page?.imageinfo?.[0]?.url || null;
  }catch(e){
    return null;
  }
}

const PHOTO_PENDING={};
async function fetchCommonsImageUrl(name){
  if (!name) return null;

  // 1) Asset locale: sorgente primaria, funziona anche nel canvas.
  if (window.LOCAL_PHOTOS && window.LOCAL_PHOTOS[name]) return (window.LOCAL_PHOTOS_WEBP&&window.LOCAL_PHOTOS_WEBP[name])||window.LOCAL_PHOTOS[name];

  // 2) Cache (anche negativa) e richieste già in corso.
  if (name in PHOTO_CACHE) return PHOTO_CACHE[name];
  if (PHOTO_PENDING[name]) return PHOTO_PENDING[name];

  PHOTO_PENDING[name] = (async () => {
    // 3) URL preimpostato: usato SOLO se l'immagine si carica davvero.
    //    (prima un URL errato bloccava per sempre la ricerca e restavano le iniziali)
    const pre = PRESET_PHOTOS[name];
    if (pre && await imgFrom(pre)) return pre;

    // 4) Ricerca su Wikimedia Commons (poche varianti del nome, per non inondare di richieste).
    // solo varianti col nome completo (il solo nome o cognome pescava foto di altre persone)
    const candidates = buildImageCandidates(name).filter(c => !/\s/.test(name) || /[\s_]/.test(c)).slice(0, 3);
    for (const candidate of candidates) {
      const urls = [
        `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(candidate)}&gsrnamespace=6&gsrprop=title&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=600`,
        `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&list=search&srsearch=${encodeURIComponent(candidate)}&srnamespace=6&srlimit=5`
      ];
      for (const url of urls) {
        try {
          const res = await fetch(url, { headers: { Accept: "application/json" }});
          if (!res.ok) continue;
          const data = await res.json();
          const page = data?.query?.pages ? Object.values(data.query.pages).find(p => {
            if (!p || !p.title) return false;
            const t = p.title.replace(/^File:/i, "").toLowerCase();
            const cand = candidate.toLowerCase();
            return t.includes(cand) || cand.includes(t) || stripAccents(t).includes(stripAccents(cand));
          }) : null;
          const img = page?.imageinfo?.[0]?.thumburl || page?.imageinfo?.[0]?.url || null;
          if (img) return img;
          for (const hit of (data?.query?.search || [])) {
            const imageUrl = await fetchCommonsImageByTitle(hit.title || "");
            if (imageUrl) return imageUrl;
          }
        } catch (e) {}
      }
    }
    return null;
  })().then(u => { PHOTO_CACHE[name] = u; delete PHOTO_PENDING[name]; return u; });

  return PHOTO_PENDING[name];
}

async function resolvePhotoNames(names){
  const unique = [...new Set(names.filter(Boolean))];
  const entries = await Promise.all(unique.map(async name => {
    try {
      return [name, await fetchCommonsImageUrl(name)];
    } catch(e) {
      return [name, null];
    }
  }));
  return Object.fromEntries(entries);
}

// Risposta (-2..2) a ogni domanda che porta il punteggio di ogni asse il più vicino possibile al profilo della persona.
function buildRecipe(v){
  const ans=Array(Q.length).fill(0);
  for(let a=0;a<AX.length;a++){
    const qs=[];Q.forEach((q,qi)=>{if(q[0]===a)qs.push(qi)});
    const maxS=2*qs.length;
    const S=Math.max(-maxS,Math.min(maxS,Math.round((v[a]-50)/50*maxS)));
    const sg=Math.sign(S),vals=qs.map(()=>0);
    for(let t=0;t<Math.abs(S);t++)vals[t%qs.length]+=sg;
    qs.forEach((qi,j)=>{ans[qi]=vals[j]*Q[qi][1]});   // q[1] = polarità della domanda
  }
  return ans;
}
const scoresOf=ans=>{const s=Array(12).fill(0),n=Array(12).fill(0);Q.forEach((q,qi)=>{s[q[0]]+=q[1]*ans[qi];n[q[0]]+=2});return s.map((x,k)=>Math.round(50+50*x/n[k]))};
const rawComp=(a,b)=>{let d=0;for(let k=0;k<12;k++)d+=Math.abs(a[k]-b[k]);return 100-d/12*1.3};   // stessa formula di comp(), senza arrotondare
function margin(ans,k){
  const sc=scoresOf(ans),t=rawComp(sc,PPL[k][4]);let best=-1e9;
  for(let i=0;i<PPL.length;i++){if(i===k)continue;const c=rawComp(sc,PPL[i][4]);if(c>best)best=c}
  return t-best;
}
// se con la ricetta "naturale" qualcun altro è davanti, ritocca le risposte una alla volta finché esce lui
function improveRecipe(ans,k){
  let cur=margin(ans,k);
  for(let round=0;round<8&&cur<=0;round++){
    let gain=0,bq=-1,bv=0;
    for(let qi=0;qi<Q.length;qi++)for(const dv of [-1,1]){
      const nv=ans[qi]+dv;if(nv<-2||nv>2)continue;
      const old=ans[qi];ans[qi]=nv;const m=margin(ans,k);ans[qi]=old;
      if(m-cur>gain+1e-9){gain=m-cur;bq=qi;bv=nv}
    }
    if(bq<0)break;ans[bq]=bv;cur+=gain;
  }
  return ans;
}

 const q=Q[order[i]],ax=AX[q[0]];
 app.innerHTML=head()+'<div class="bar"><i style="width:'+((i/(Q.length-1)*100))+'%"></i></div><div class="meta"><span>'+String(i+1).padStart(2,"0")+' / '+Q.length+'</span><span class="axtag">'+ax[0]+' — '+ax[1]+'</span></div><div class="q">'+q[2]+'</div><div class="opts">'+OPT.map((o,k)=>'<button class="opt" data-k="'+k+'">'+o[0]+'</button>').join("")+'</div>'+(i>0?'<div class="act"><button class="btn ghost" id="back">← Indietro</button></div>':'');
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=OPT[b.dataset.k][1];i++;i<Q.length?ask():result()});
 const bk=document.getElementById("back");if(bk)bk.onclick=()=>{i--;ask()};

function scores(){
 const s=Array(12).fill(0),n=Array(12).fill(0);
 order.forEach((qi,k)=>{const q=Q[qi];s[q[0]]+=q[1]*ans[k];n[q[0]]+=2});
 return s.map((v,k)=>Math.round(50+50*v/n[k]));
}

const comp=(a,b)=>{let d=0;for(let k=0;k<12;k++)d+=Math.abs(a[k]-b[k]);return Math.max(1,Math.round(100-d/12*1.3))};

const rank=(arr,sc)=>{
  return arr.filter(Array.isArray).map(x=>{
    // PPL: [nome, descrizione, tipo, attuale, valori]
    if (x.length >= 5 && Array.isArray(x[4]) && x[4].length === 12) {
      return {n:x[0],t:x[1],k:x[2],a:x[3],v:x[4],c:comp(sc,x[4])};
    }
    // CTR: [nome, valori]
    if (x.length >= 2 && Array.isArray(x[1]) && x[1].length === 12) {
      return {n:x[0],t:"Paese",k:"C",a:1,v:x[1],c:comp(sc,x[1])};
    }
    return null;
  }).filter(Boolean).sort((a,b)=>b.c-a.c);
};

const ini=n=>n.split(" ").filter(w=>w.length>2||w===w.toUpperCase()).slice(0,2).map(w=>w[0]).join("").toUpperCase();

function radarMarkup(values){
  const cx=190,cy=170,r=112,point=(value,index,scale=1)=>{
    const angle=(Math.PI*2*index/AX.length)-Math.PI/2,distance=r*value/100*scale;
    return [cx+Math.cos(angle)*distance,cy+Math.sin(angle)*distance];
  };
  const grid=[25,50,75,100].map(level=>'<polygon class="grid" points="'+AX.map((_,j)=>point(level,j).join(",")).join(" ")+'"></polygon>').join("");
  const spokes=AX.map((_,j)=>{const [x,y]=point(100,j);return '<line class="grid" x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'"></line><text x="'+point(116,j)[0]+'" y="'+point(116,j)[1]+'" text-anchor="middle">'+String(j+1).padStart(2,"0")+'</text>'}).join("");
  return '<svg class="chart" viewBox="0 0 380 340" role="img" aria-label="Grafico radar dei tuoi punteggi sui dodici assi"><title>Il tuo profilo sui dodici assi</title>'+grid+spokes+'<polygon class="radar-shape" points="'+values.map((v,j)=>point(v,j).join(",")).join(" ")+'"></polygon></svg>';
}

function comparisonMapMarkup(values,xAxis=0,yAxis=1){
  const w=520,h=340,left=48,right=18,top=18,bottom=48,plotW=w-left-right,plotH=h-top-bottom;
  const coords=profile=>[left+profile[xAxis]/100*plotW,top+(100-profile[yAxis])/100*plotH];
  const positions=PPL.map((person,index)=>{const [x,y]=coords(person[4]);return {person,index,x,y,distance:Math.hypot(person[4][xAxis]-values[xAxis],person[4][yAxis]-values[yAxis])}}).sort((a,b)=>a.distance-b.distance);
  const grid=[0,25,50,75,100].map(v=>'<line class="grid" x1="'+(left+plotW*v/100)+'" y1="'+top+'" x2="'+(left+plotW*v/100)+'" y2="'+(top+plotH)+'"></line><line class="grid" x1="'+left+'" y1="'+(top+plotH*(1-v/100))+'" x2="'+(left+plotW)+'" y2="'+(top+plotH*(1-v/100))+'"></line>').join("");
  const dots=positions.map(point=>'<circle class="map-point" tabindex="0" role="button" data-person="'+point.index+'" cx="'+point.x.toFixed(1)+'" cy="'+point.y.toFixed(1)+'" r="4"><title>'+esc(point.person[0])+': '+point.person[4][xAxis]+'% / '+point.person[4][yAxis]+'%</title></circle>').join("");
  const [ux,uy]=coords(values),rating=distance=>Math.round(100-distance/Math.sqrt(2));
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Mappa di profili e utente sugli assi selezionati">'+grid+dots+'<circle class="map-user" cx="'+ux.toFixed(1)+'" cy="'+uy.toFixed(1)+'" r="7"><title>Il tuo profilo</title></circle><text x="'+(left+plotW/2)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(AX[xAxis][0]+' → '+AX[xAxis][1])+'</text><text x="12" y="'+(top+plotH/2)+'" text-anchor="middle" transform="rotate(-90 12 '+(top+plotH/2)+')">'+esc(AX[yAxis][0]+' → '+AX[yAxis][1])+'</text></svg><div class="map-nearest">'+positions.slice(0,5).map(point=>'<button type="button" data-person="'+point.index+'"><span>'+esc(point.person[0])+'</span><span>'+rating(point.distance)+'% vicinanza</span></button>').join("")+'</div>';
}

function heroCard(label, person, photoUrl){
  const initials = ini(person.n);
  const fallback=window.LOCAL_PHOTOS&&window.LOCAL_PHOTOS[person.n];
  const imageMarkup = photoUrl
    ? '<img class="ph" alt="'+person.n+'" src="'+photoUrl+'"'+(fallback&&fallback!==photoUrl?' data-fallback="'+fallback+'"':'')+' onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.removeAttribute(\'data-fallback\')}else{this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'ph ava\',textContent:\''+initials+'\'}))}">'
    : '<div class="ph ava">'+initials+'</div>';
  return '<div class="hero"><div class="kick">'+label+'</div>'+imageMarkup+'<div class="big">'+person.c+'%</div><b>'+person.n+'</b><div style="color:var(--mute);font-size:14px">'+person.t+'</div></div>';
}

async function result(){
  currentPage="result";
  const sc=scores();
  const ide=IDE.map(x=>({n:x[0],cat:x[1],c:comp(sc,x[2])})).sort((a,b)=>b.c-a.c)[0];
  const ppl=rank(PPL,sc);
  const ctr=rank(CTR,sc);

  const best=ppl[0] ?? { n:"N/D", c:0 };
  const O=ppl.find(p => p && p.a && p.k==="P" && ITA.has(p.n)) ?? ppl.find(p => p && p.k==="P") ?? null;
  const Pp=ppl.find(p => p && !p.a) ?? ppl[0] ?? null;

  const photoNames = [...new Set([
    ...(O ? [O.n] : []),
    ...(Pp ? [Pp.n] : []),
    ...ppl.filter(p => p.a && p.k==="P" && !ITA.has(p.n)).slice(0,3).map(p => p.n),
    ...ppl.filter(T => true).slice(0,12).map(p => p.n)
  ])];

  const photoMap = await resolvePhotoNames(photoNames);

  const bars=AX.map((a,k)=>'<div class="ax"><div class="ic">'+String(k+1).padStart(2,"0")+'</div><div><b>'+a[0]+'</b><small>contro '+a[1]+'</small><div class="trk"><i style="width:'+sc[k]+'%"></i></div></div><div class="pc">'+sc[k]+'%</div></div>').join("");
  const rowsOf=(arr,sub)=>arr.map((p,j)=>'<div class="row"><span>'+(sub?(j+1)+'. ':'')+p.n+(sub?'<small style="display:block;color:var(--mute);font-size:12px">'+p.t+'</small>':'')+'</span><span>'+p.c+'%</span></div>').join("");
  const world=ppl.filter(p=>p.a&&p.k==="P"&&!ITA.has(p.n)).slice(0,3);

  app.innerHTML=head()+'<div class="card"><div class="kick">§ 03 · '+ide.cat+'</div><h2>'+ide.n+'</h2>'
  +'<div class="duo">'+(O?heroCard("Oggi · Italia",O,photoMap[O.n]||null):"")+(Pp?heroCard("Del passato",Pp,photoMap[Pp.n]||null):"")+'</div>'
  +'<div class="box"><h3>Nel mondo, oggi</h3>'+rowsOf(world,true)+'</div>'
  +'<div class="box"><h3>I tuoi 12 assi · stima orientativa</h3>'+bars+'<p class="notice">Punteggi derivati dalle tue risposte: tre domande per asse. Non sono una diagnosi né misure validate.</p></div>'
  +'<div class="box"><h3>Radar · il tuo profilo</h3>'+radarMarkup(sc)+'</div>'
  +'<div class="box" id="political-map"><div class="map-controls"><label>Asse orizzontale<select id="map-x">'+AX.map((a,k)=>'<option value="'+k+'">'+esc(a[0]+' / '+a[1])+'</option>').join("")+'</select></label><label>Asse verticale<select id="map-y">'+AX.map((a,k)=>'<option value="'+k+'"'+(k===1?' selected':'')+'>'+esc(a[0]+' / '+a[1])+'</option>').join("")+'</select></label></div><div id="map-plot"></div><p class="hint">La vicinanza qui usa solo i due assi selezionati; gli altri non entrano nel calcolo.</p></div>'
  +'<div class="notice">Profili dei personaggi: stime indicative. Data di aggiornamento e fonti non registrate; nessun controllo automatico esterno.</div>'
  +'<div class="box"><h3>Le tue personalità</h3><div class="tabs" id="tabs"></div><div id="plist"></div></div>'
  +'<div class="box"><h3>Paesi vicini</h3>'+rowsOf(ctr.slice(0,3),false)+'</div></div>'
  +'<div class="act"><button class="btn" id="wa">Condividi su WhatsApp</button><button class="btn ghost" id="png">Scarica PNG ↓</button><button class="btn ghost" id="cp">Copia testo</button><button class="btn ghost" id="again">Rifai</button></div><p id="msg" class="mono" style="margin-top:14px;font-size:11px"></p>';

  document.getElementById("again").onclick=()=>{currentPage="intro";intro()};
  const T=[["Tutti",p=>1],["Politici",p=>p.k==="P"],["Filosofi",p=>p.k==="F"],["Italia oggi",p=>p.a&&ITA.has(p.n)],["Mondo oggi",p=>p.a&&!ITA.has(p.n)],["Del passato",p=>!p.a]];
  const tb=document.getElementById("tabs"),pl=document.getElementById("plist");
  const show=n=>{tb.innerHTML=T.map((t,j)=>'<button class="tab'+(j==n?' on':'')+'" data-j="'+j+'">'+t[0]+'</button>').join("");pl.innerHTML=rowsOf(ppl.filter(T[n][1]).slice(0,6),true);tb.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(+b.dataset.j))};
  show(0);
  const map=document.getElementById("political-map"),mapX=document.getElementById("map-x"),mapY=document.getElementById("map-y"),plot=document.getElementById("map-plot");
  const renderMap=()=>{const x=+mapX.value,y=+mapY.value;plot.innerHTML=comparisonMapMarkup(sc,x,y)};
  map.addEventListener("change",e=>{if(e.target===mapX||e.target===mapY){if(mapX.value===mapY.value)mapY.value=String((+mapY.value+1)%AX.length);renderMap()}});
  map.addEventListener("click",e=>{const point=e.target.closest("[data-person]");if(point)openPerson(+point.dataset.person)});
  map.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".map-point")){e.preventDefault();openPerson(+e.target.dataset.person)}});
  renderMap();

  const msg=document.getElementById("msg");
  document.getElementById("cp").onclick=async()=>{
    const t="Il mio risultato 12 Assi: "+ide.n+" ("+ide.cat+")\nPiù compatibile: "+best.n+" "+best.c+"%\n"+AX.map((a,k)=>a[0]+" "+sc[k]+"%").join(" · ");
    try{await navigator.clipboard.writeText(t);msg.textContent="Testo copiato."}catch(e){msg.textContent="Copia non disponibile."}
  };
  const data={ide,sc,O,Pp,world,ctr:ctr.slice(0,3),photos:photoMap};
  let pngP=null;
  const prepare=()=>{if(!pngP)pngP=buildPNG(data).catch(e=>{pngP=null;throw e});return pngP};
  prepare().catch(()=>{}); // pre-genera il PNG in background, così il click è immediato e il "gesto utente" per share non scade
  const run=async mode=>{
    msg.textContent="Genero il PNG…";
    let blob;
    try{blob=await prepare()}catch(e){console.error(e);msg.textContent="Errore nella creazione del PNG.";return}
    let r;
    try{r=await deliverPNG(blob,data.ide.n,mode)}catch(e){console.error(e);msg.textContent="Errore nel salvataggio del PNG.";return}
    const miss=window.__missingPhotos||[];
    msg.textContent=({shared:"",cancel:"",fallback:"Condivisione non supportata qui: ho scaricato il PNG, mandalo su WhatsApp a mano.",downloaded:"PNG scaricato."}[r]||"")+(miss.length?" Foto non disponibile per: "+miss.join(", ")+" (nel PNG ci sono le iniziali).":"");
  };
  document.getElementById("wa").onclick=()=>run("share");
  document.getElementById("png").onclick=()=>run("download");

  window.scrollTo(0,0);
}

function loadScript(src){return new Promise(r=>{const t=document.createElement("script");t.src=src;t.onload=()=>r(true);t.onerror=()=>r(false);document.head.appendChild(t)})}
function imgFrom(src,cors){return new Promise(r=>{const im=new Image();if(cors)im.crossOrigin="anonymous";im.onload=()=>r(im.naturalWidth?im:null);im.onerror=()=>r(null);im.src=src})}
let p64Promise=null;
const IMG_CACHE={};
// Restituisce SEMPRE un'immagine "pulita" (che non sporca il canvas) oppure null.
async function loadImgClean(src,name){
  const isFile=location.protocol==="file:";
  const local=(window.LOCAL_PHOTOS_WEBP&&window.LOCAL_PHOTOS_WEBP[name])||(window.LOCAL_PHOTOS&&window.LOCAL_PHOTOS[name])||(src&&!/^https?:/i.test(src)?src:null);
  let im=null;

  // 1) Foto locale: preferita per l'uso offline e sicura nel canvas file://.
  if(local){im=await imgFrom(local);if(im)return im}

  // 2) Foto remota: prima scaricala come Blob, così l'immagine caricata nel
  // canvas non eredita l'origine della pagina e non lo rende "tainted".
  if(src&&/^https?:/i.test(src)){
    try{const r=await fetch(src,{mode:"cors"});if(r.ok){const u=URL.createObjectURL(await r.blob());im=await imgFrom(u);if(im)return im}}catch(e){}
    im=await imgFrom(src,true);if(im)return im;
  }
  return null;
}
function loadImg(src,name){
  if(!IMG_CACHE[name])IMG_CACHE[name]=loadImgClean(src,name).then(im=>{if(!im)delete IMG_CACHE[name];return im});
  return IMG_CACHE[name];
}
function wrapLines(x,text,maxW){
  const words=text.split(" "),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines;
}
// Formato verticale 1080x2200, pensato per la condivisione mobile.
async function drawCard(d,withPhotos){
  if(document.fonts){try{await Promise.all(["400 20px Outfit","600 20px Outfit","700 20px Outfit","800 20px Outfit"].map(f=>document.fonts.load(f)));await document.fonts.ready}catch(e){}}
  const W=1080,H=2200,P=64,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const BG="#0a0a0a",INK="#f2f0ea",MUTE="#8d8c85",LINE="#2a2a27",AC="#ff3b1f",SANS="Outfit,system-ui,sans-serif",MONO="ui-monospace,Menlo,Consolas,monospace";
  const T=(t,px,py,o={})=>{x.font=(o.w||700)+" "+(o.s||28)+"px "+(o.m?MONO:SANS);x.fillStyle=o.c||INK;x.textAlign=o.a||"left";x.textBaseline="alphabetic";
    x.letterSpacing=(o.ls!==undefined?o.ls:0)+"px";x.fillText(o.u?t.toUpperCase():t,px,py)};
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  // carica le due foto in parallelo
  const heroes=[["OGGI · ITALIA",d.O],["DEL PASSATO",d.Pp]];
  const imgs=await Promise.all(heroes.map(([l,p])=>withPhotos&&p?loadImg(d.photos&&d.photos[p.n],p.n):null));
  window.__missingPhotos=heroes.map(([l,p],k)=>p&&!imgs[k]?p.n:null).filter(Boolean);
  // header
  T("12/ASSI",P,P+28,{s:34,w:800,ls:1});
  T("TEST POLITICO",W-P,P+26,{s:18,m:1,c:MUTE,a:"right",ls:2,w:500});
  x.fillStyle=LINE;x.fillRect(P,P+50,W-2*P,2);
  // ideologia
  T("§ "+d.ide.cat.toUpperCase(),P,196,{s:20,m:1,c:AC,ls:3,w:600});
  let fs=112;x.font="800 "+fs+"px "+SANS;x.letterSpacing="-3px";
  while(x.measureText(d.ide.n.toUpperCase()).width>W-2*P&&fs>48){fs-=4;x.font="800 "+fs+"px "+SANS}
  T(d.ide.n,P,196+fs+14,{s:fs,w:800,u:1,ls:-3});
  T("STIMA ORIENTATIVA · 3 DOMANDE PER ASSE",P,374,{s:15,m:1,c:MUTE,ls:1,w:500});
  // leader: due colonne con foto grandi
  const hy=420,gap=32,cw=(W-2*P-gap)/2,hs=cw;
  for(let k=0;k<2;k++){
    const [lab,p]=heroes[k];if(!p)continue;const hx=P+k*(cw+gap),py=hy+24;
    T(lab,hx,hy,{s:16,m:1,c:MUTE,ls:3,w:500});
    const im=imgs[k];
    if(im){
      x.save();x.beginPath();x.rect(hx,py,hs,hs);x.clip();
      const r=Math.max(hs/im.width,hs/im.height),w=im.width*r,h=im.height*r;
      x.drawImage(im,hx+(hs-w)/2,py+(hs-h)*0.2,w,h);x.restore();
    }else{
      x.fillStyle="#111110";x.fillRect(hx,py,hs,hs);x.strokeStyle=LINE;x.lineWidth=2;x.strokeRect(hx,py,hs,hs);
      T(ini(p.n),hx+hs/2,py+hs/2+36,{s:110,w:800,c:MUTE,a:"center"});
    }
    const by=py+hs;
    T(p.c+"%",hx,by+88,{s:80,w:800,c:AC,ls:-2});
    x.font="700 28px "+SANS;x.letterSpacing="0px";
    const nl=wrapLines(x,p.n.toUpperCase(),cw).slice(0,2);
    nl.forEach((l,j)=>T(l,hx,by+136+j*34,{s:28,w:700}));
    T(p.t,hx,by+136+nl.length*34+6,{s:20,w:400,c:MUTE});
  }
  // assi
  const ay=1180;x.fillStyle=LINE;x.fillRect(P,ay-38,W-2*P,2);
  T("I TUOI 12 ASSI",P,ay,{s:16,m:1,c:MUTE,ls:3,w:500});
  const colW=(W-2*P-48)/2;
  AX.forEach((a,k)=>{const col=k%2,row=Math.floor(k/2),bx=P+col*(colW+48),by=ay+52+row*100;
    T(a[0].toUpperCase(),bx,by,{s:22,w:700,ls:.5});T(d.sc[k]+"%",bx+colW,by,{s:26,w:800,a:"right"});
    T("contro "+a[1].toLowerCase(),bx,by+26,{s:16,w:400,c:MUTE});
    x.fillStyle=LINE;x.fillRect(bx,by+40,colW,5);x.fillStyle=AC;x.fillRect(bx,by+40,colW*d.sc[k]/100,5)});
  const rcx=W/2,rcy=1940,rr=94,radarPoint=(value,k)=>{const angle=Math.PI*2*k/AX.length-Math.PI/2,r=rr*value/100;return [rcx+Math.cos(angle)*r,rcy+Math.sin(angle)*r]};
  T("RADAR · I TUOI 12 ASSI",P,1832,{s:16,m:1,c:MUTE,ls:3,w:500});
  x.strokeStyle=LINE;x.lineWidth=2;
  for(const level of [25,50,75,100]){x.beginPath();AX.forEach((_,k)=>{const [px,py]=radarPoint(level,k);k?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.stroke()}
  AX.forEach((_,k)=>{const [px,py]=radarPoint(100,k);x.beginPath();x.moveTo(rcx,rcy);x.lineTo(px,py);x.stroke()});
  x.beginPath();d.sc.forEach((value,k)=>{const [px,py]=radarPoint(value,k);k?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fillStyle="rgba(255,59,31,.2)";x.fill();x.strokeStyle=AC;x.lineWidth=4;x.stroke();
  // footer
  const fy=H-P;x.fillStyle=LINE;x.fillRect(P,fy-58,W-2*P,2);
  T("PAESE PIÙ VICINO: "+(d.ctr[0]?d.ctr[0].n.toUpperCase()+" "+d.ctr[0].c+"%":"—"),P,fy-12,{s:17,m:1,c:INK,ls:2,w:500});
  T("12 ASSI",W-P,fy-12,{s:17,m:1,c:AC,a:"right",ls:3,w:700});
  return c;
}
const canvasBlob=c=>new Promise((res,rej)=>{try{c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png")}catch(e){rej(e)}});
async function buildPNG(d){
  try{return await canvasBlob(await drawCard(d,true))}
  catch(e){console.warn("Canvas con foto non esportabile, riprovo senza foto:",e);return await canvasBlob(await drawCard(d,false))}
}
async function deliverPNG(blob,ideName,mode){
  const file=new File([blob],"12assi-risultato.png",{type:"image/png"});
  if(mode==="share"&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],text:"Il mio risultato su 12 Assi: "+ideName});return "shared"}
    catch(e){if(e&&e.name==="AbortError")return "cancel";console.warn("share fallita, scarico il PNG:",e)}
  }
  const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="12assi-risultato.png";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  return mode==="share"?"fallback":"downloaded";
}
